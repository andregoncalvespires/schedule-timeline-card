name: Release

on:
  push:
    branches: [main]
    paths:
      - schedule-timeline-card.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create tag and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import re; m = re.search(r'CARD_VERSION = \"([^\"]+)\"', open('schedule-timeline-card.js').read()); print(m.group(1) if m else '')")
          if [ -z "$version" ]; then
            echo "CARD_VERSION not found in schedule-timeline-card.js" >&2
            exit 1
          fi
          echo "Version found: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
          else
            gh release create "$tag" schedule-timeline-card.js \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          fi
