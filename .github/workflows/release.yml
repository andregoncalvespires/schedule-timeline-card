name: Release

# Runs only after the "Validate" workflow has finished successfully on main,
# so a release is always created after the HACS validation has passed.
# It can also be started manually from the Actions tab.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create tag and release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        run: |
          version=$(python3 -c "import re; m = re.search(r'CARD_VERSION = \"([^\"]+)\"', open('schedule-timeline-card.js').read()); print(m.group(1) if m else '')")
          if [ -z "$version" ]; then
            echo "CARD_VERSION not found in schedule-timeline-card.js" >&2
            exit 1
          fi
          echo "Version found: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if the tag does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
          else
            gh release create "$tag" schedule-timeline-card.js \
              --target "$TARGET_SHA" \
              --title "$tag" \
              --generate-notes
          fi
