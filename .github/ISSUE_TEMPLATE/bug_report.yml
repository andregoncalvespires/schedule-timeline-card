name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Card version
      description: Shown in the browser console as SCHEDULE-TIMELINE-CARD vX.Y.Z
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration (YAML)
      render: yaml
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include screenshots and any browser console errors if possible.
    validations:
      required: true
